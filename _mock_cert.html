<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F7FC;font-family:Inter,system-ui,sans-serif;padding:16px}
.c3{max-width:760px;margin:0 auto;background:linear-gradient(135deg,#E3242B 0 50%,#0B2A5B 50% 100%);padding:12px;border-radius:6px}
.c3-in{background:#fff;padding:10px}
.c3-fr{border:1px solid #0B2A5B;outline:1px solid #C9D3E3;outline-offset:-6px;padding:clamp(22px,5vw,40px) clamp(16px,4vw,44px) clamp(20px,4vw,32px);text-align:center;color:#0B2A5B}
.c3-logo{width:clamp(96px,22vw,130px);display:block;margin:0 auto}
.c3-t{font-family:Poppins,sans-serif;font-weight:700;font-size:clamp(24px,6vw,40px);letter-spacing:.14em;margin:clamp(16px,3vw,22px) 0 2px;line-height:1.1}
.c3-st{font-family:Poppins,sans-serif;font-weight:500;font-size:clamp(11px,2.6vw,14px);letter-spacing:.32em;color:#E3242B;text-transform:uppercase}
.c3-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:clamp(14px,3vw,20px) auto;max-width:260px}
.c3-orn i{flex:1;height:1px;background:#C9D3E3}.c3-orn b{width:7px;height:7px;transform:rotate(45deg);background:#0B2A5B}
.c3-s{font-size:clamp(11px,2.6vw,13px);letter-spacing:.18em;text-transform:uppercase;color:#5B6B82;margin:0}
.c3-n{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(30px,7.6vw,48px);line-height:1.15;margin:clamp(8px,2vw,12px) auto 0;padding:0 12px clamp(8px,2vw,10px);border-bottom:1px solid #0B2A5B;display:inline-block;min-width:60%}
.c3-p{font-size:clamp(14px,3.4vw,16px);line-height:1.55;color:#33415C;margin:clamp(14px,3vw,18px) 0 4px}
.c3-m{font-family:Poppins,sans-serif;font-weight:700;font-size:clamp(18px,4.6vw,24px);margin:0}
.c3-lv{font-size:clamp(13px,3.2vw,15px);color:#5B6B82;margin:2px 0 0}
.c3-sc{display:inline-flex;align-items:baseline;gap:8px;margin-top:clamp(14px,3vw,18px);border:1px solid #C9D3E3;border-radius:999px;padding:6px 16px;font-size:13px;color:#5B6B82;letter-spacing:.08em;text-transform:uppercase}
.c3-sc b{font-family:Poppins,sans-serif;font-size:17px;color:#0B2A5B;letter-spacing:0}
.c3-f{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,5vw,48px);margin-top:clamp(22px,5vw,34px);align-items:start}
.c3-col{display:flex;flex-direction:column;align-items:center}
.c3-v{height:56px;display:flex;align-items:flex-end;justify-content:center;font-family:Poppins,sans-serif;font-weight:600;font-size:clamp(13px,3.3vw,16px);padding-bottom:6px}
.c3-v img{height:52px;width:auto;max-width:100%}
.c3-ln{width:100%;border-top:1px solid #0B2A5B;padding-top:8px;font-size:clamp(10.5px,2.7vw,13px);font-weight:600;white-space:nowrap}
.c3-lb{font-size:clamp(10px,2.5vw,12px);color:#5B6B82;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
</style></head><body>
<div class="c3"><div class="c3-in"><div class="c3-fr">
<img class="c3-logo" src="mra-logo-cert.png" alt="">
<div class="c3-t">CERTIFICATE</div><div class="c3-st">of Completion</div>
<div class="c3-orn"><i></i><b></b><i></i></div>
<p class="c3-s">This is to certify that</p>
<div class="c3-n">Prueba 1</div>
<p class="c3-p">has satisfactorily completed</p>
<p class="c3-m">Module 1 · Elementary A1</p>
<p class="c3-lv">English Program · mrarrieta.com</p>
<div class="c3-sc">Final score <b>10.0 / 10</b></div>
<div class="c3-f"><div class="c3-col"><div class="c3-v">October 30th, 2026</div><div class="c3-ln">Date of issue</div><div class="c3-lb">mrarrieta.com</div></div>
<div class="c3-col"><div class="c3-v"><img src="mra-signature.png" alt=""></div><div class="c3-ln">John Jairo Arrieta Jaramillo</div><div class="c3-lb">Director</div></div></div>
</div></div></div></body></html>
