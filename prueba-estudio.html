<!doctype html><html lang="es" translate="no"><head><meta name="google" content="notranslate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba · Ofertas de video</title><link rel="icon" type="image/png" href="favicon.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#E3242B;--k:#0B2A5B;--mut:#4A5B78;--ok:#16A34A;--ok2:#DCFCE7;--bg:#EEF4FC;--line:#D8E2F0;--fh:'Poppins',sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--k);background:var(--bg)}
.sim{background:#111827;color:#fff;font-size:12.5px;padding:8px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sim b{margin-right:6px;color:#FCA5A5}.sim button{font:600 12.5px Inter;border:1px solid #374151;background:#1F2937;color:#D1D5DB;padding:6px 10px;border-radius:8px;cursor:pointer}
.sim button.on{background:#fff;color:#111827}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px}
.top img{height:46px}.tag{font:700 11px var(--fh);background:var(--k);color:#fff;padding:4px 9px;border-radius:6px}
.who{margin-left:auto;font-weight:600;font-size:14px;color:var(--mut)}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:18px}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--y);color:#fff;font:700 11px Inter;border-radius:99px;padding:2px 6px;font-style:normal}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h2{font:700 23px var(--fh);margin:4px 0}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(11,42,91,.07);padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
input,textarea,select{width:100%;font:500 15px Inter;color:var(--k);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 15px var(--fh);padding:11px 18px;border-radius:12px;border:0;background:var(--y);color:#fff;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.k{background:var(--k)}.btn.g{background:#fff;color:var(--k);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.st.a{background:var(--ok2);color:var(--ok)}.st.p{background:#FEF3C7;color:#B45309}.st.n{background:#F1F5F9;color:#64748B}.st.r{background:#FEE2E2;color:#DC2626}.st.b{background:#E0E7FF;color:#3730A3}
.pts{margin:8px 0 12px;padding:0;list-style:none}.pts li{padding:6px 0 6px 22px;position:relative;font-size:15px}
.pts li:before{content:"";position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--y)}
.modal{position:fixed;inset:0;background:rgba(11,42,91,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}.mbox{background:#fff;border-radius:18px;padding:22px;max-width:540px;width:100%;max-height:92vh;overflow:auto}
.topic{font:700 20px var(--fh);margin:0 0 6px}
.studio{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.phone{width:min(300px,80vw);aspect-ratio:9/16;border-radius:20px;overflow:hidden;position:relative;background:#000}
.phone video,.phone canvas{width:100%;height:100%;object-fit:cover;display:block}
.recb{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;font:700 13px Inter;padding:5px 10px;border-radius:99px;display:none}
.recb.on{display:block}.recb:before{content:"● ";color:var(--y)}
.prog{position:absolute;left:0;bottom:0;height:5px;background:var(--y);width:0}
.side{width:min(380px,100%)}
.tele{height:260px;overflow:hidden;position:relative;border-radius:12px;background:var(--k);color:#fff;margin:8px 0 12px}
.tele .in{position:absolute;left:0;right:0;top:0;padding:18px;font-size:21px;line-height:1.55;font-weight:600;white-space:pre-wrap}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden}.mail .h{background:#F8FAFC;padding:10px 14px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line)}
.mail .b{padding:18px 14px;font-size:15px;line-height:1.55}
.ntf{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.ntf small{color:var(--mut);display:block}
.chk{text-transform:none;letter-spacing:0;font-weight:500;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:12px 0;color:var(--k)}.chk input{width:auto;margin-top:3px}
.tip{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.tip span{font-size:26px;width:36px;text-align:center}.tip b{display:block;font-size:15.5px}.tip small{color:var(--mut);font-size:13.5px}
.lq{position:absolute;left:10px;right:10px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.lq span{background:rgba(0,0,0,.6);color:#fff;font:600 12px Inter;padding:5px 9px;border-radius:99px}.lq span.bad{background:rgba(227,36,43,.9)}
.recfab{display:none;position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:rgba(0,0,0,.25);padding:0;cursor:pointer}
.recfab i{display:block;width:48px;height:48px;margin:6px;border-radius:50%;background:var(--y);transition:.2s}.recfab.on i{width:26px;height:26px;margin:17px;border-radius:6px}
.telem{display:none;position:absolute;left:10px;right:10px;top:46px;height:84px;overflow:hidden;background:rgba(11,42,91,.72);border-radius:12px}
.telem div{padding:8px 12px;color:#fff;font:600 15px/1.45 Inter,sans-serif;white-space:pre-wrap;transition:transform .2s linear}
height:10px;background:#E2E8F0;border-radius:99px;overflow:hidden}.ebar i{display:block;height:100%;width:0;background:var(--y);transition:width .2s}
@media(max-width:640px){.recfab{display:block}.telem.on{display:block}.phone{width:72vw}.r3{grid-template-columns:1fr}.top img{height:46px}.who{display:none}.bell{margin-left:auto}}

</head><body>
<div class="sim"><b>SIMULACIÓN</b>Ver como:
<button data-r="admin">Administración</button><button data-r="profe">Profe (tú)</button><button data-r="otro">Otro profe</button><button data-r="est">Estudiante adulto (tú)</button></div>
<div class="top"><img src="mra-brand.png" alt="mrarrieta.com"><span class="tag" id="tag"></span><span class="who" id="who"></span><button class="bell" id="bell">🔔<i id="bn" style="display:none"></i></button></div>
<div class="wrap" id="main"></div>

<div class="modal" id="md"><div class="mbox" id="mb"></div></div>

<script>
const $=s=>document.querySelector(s);
const S={role:'admin',offers:[],ntf:{profe:[],otro:[],est:[]},pay:{profe:[]},cls:{est:4},seen:{}};
let oid=0;
const NAMES={admin:['ADMIN','John · Administración'],profe:['PORTAL PROFE','Mr. John'],otro:['PORTAL PROFE','Mrs. Jennifer'],est:['PORTAL ESTUDIANTE','John (estudiante)']};
const aud=r=>r=='est'?'est':'profe';
const prize=o=>o.aud=='est'?'1 clase gratis':'$'+Number(o.pay).toLocaleString('es-CO');
const stTxt={open:['Publicada · esperando','b'],taken:['Tomada · grabando','p'],sent:['Por revisar','p'],ok:['Aprobado','a'],no:['Rechazado','r']};
function setRole(r){S.role=r;document.querySelectorAll('.sim button').forEach(b=>b.classList.toggle('on',b.dataset.r==r));
 $('#tag').textContent=NAMES[r][0];$('#who').textContent=NAMES[r][1];$('#bell').style.display=r=='admin'?'none':'';render();popCheck()}
document.querySelectorAll('.sim button').forEach(b=>b.onclick=()=>{stopCam();setRole(b.dataset.r)});
function openM(h){$('#mb').innerHTML=h;$('#md').classList.add('on')}function closeM(){$('#md').classList.remove('on')}
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};
function badge(){const n=S.role=='admin'?0:S.ntf[S.role].filter(x=>!x.r).length;$('#bn').style.display=n?'':'none';$('#bn').textContent=n}
$('#bell').onclick=()=>{const L=S.ntf[S.role];L.forEach(x=>x.r=1);badge();
 openM('<div class="topic">Notificaciones</div>'+(L.length?L.slice().reverse().map(x=>`<div class="ntf">${x.t}<small>${x.d}</small></div>`).join(''):'<div class="empty">No tienes notificaciones</div>')+'<div style="margin-top:14px"><button class="btn g" onclick="closeM()">Cerrar</button></div>')};
function now(){return new Date().toLocaleString('es-CO',{hour:'numeric',minute:'2-digit',day:'numeric',month:'short'})}

/* ---------- render ---------- */
function render(){badge();const r=S.role;
 if(r=='admin')return admin();
 const a=aud(r),mine=S.offers.filter(o=>o.aud==a&&o.by==r);
 let h=`<h2>${r=='est'?'Hola, John':'Hola, '+NAMES[r][1]}</h2><p class="sub">${r=='est'?'Tu portal de estudiante':'Tu portal de profe'}</p>`;
 const act=mine.find(o=>o.st=='taken');
 if(act)h+=`<div class="card"><div class="row" style="border:0;padding-top:0"><b>🎬 Tienes un video pendiente por grabar</b><span class="st p">Plazo: 48 h</span></div><div style="margin:4px 0 12px">${esc(act.topic)}</div><button class="btn" onclick="tips(${act.id})">● Grabar o subir mi video</button></div>`;
 if(r=='est')h+=`<div class="card"><div class="row" style="border:0;padding:0"><span>Clases disponibles este mes</span><b style="font:800 22px var(--fh)">${S.cls.est}</b></div></div>`;
 if(r=='profe'||r=='otro'){const P=S.pay[r]||[],tot=P.reduce((s,x)=>s+x.v,0);
  h+=`<div class="card"><b>Mi pago de noviembre</b><div class="row"><span>Clases dictadas · 18 × $21.800</span><b>$392.400</b></div>${P.map(x=>`<div class="row" style="background:#F0FDF4"><span>🎬 Contenido · ${esc(x.t)}</span><b style="color:var(--ok)">$${x.v.toLocaleString('es-CO')}</b></div>`).join('')}<div class="row" style="border:0"><b>Total</b><b style="font:800 17px var(--fh)">$${(392400+tot).toLocaleString('es-CO')}</b></div></div>`}
 if(mine.length)h+=`<div class="card"><b>Mis videos</b>${mine.map(o=>`<div class="row"><span>${esc(o.topic)}</span><span class="st ${stTxt[o.st][1]}">${o.st=='sent'?'En revisión':o.st=='ok'?'Aprobado · '+prize(o):stTxt[o.st][0]}</span></div>`).join('')}</div>`;
 $('#main').innerHTML=h}

function admin(){
 let h=`<h2>Ofertas de video</h2><p class="sub">Solo aparecen cuando tú las publicas. El primero que acepta, la graba.</p>
 <div class="card"><b>Nueva oferta</b>
 <label>Para</label><select id="f-aud"><option value="profe">Profesores (pago en dinero)</option><option value="est">Estudiantes adultos (1 clase gratis)</option></select>
 <label>Tema</label><input id="f-topic" value="Error común: “I have 25 years”">
 <label>Qué debe decir (una idea por línea)</label><textarea id="f-pts">“I have 25 years” está mal
Se dice “I am 25 years old”
Da 2 ejemplos más
Invita a practicar en mrarrieta.com</textarea>
 <div class="r3"><div id="w-pay"><label>Pago</label><input id="f-pay" type="number" value="12000"></div><div><label>Cupos</label><input value="1" disabled></div><div><label>Plazo para grabar</label><input value="48 horas" disabled></div></div>
 <div style="margin-top:14px"><button class="btn" id="b-pub">Publicar</button></div></div>`;
 const L=S.offers.slice().reverse();
 h+=`<div class="card"><b>Ofertas</b>${L.length?L.map(o=>`<div class="row"><span><span class="st n">${o.aud=='est'?'Estudiantes':'Profes'}</span> ${esc(o.topic)}<br><small style="color:var(--mut)">${o.by?'Tomada por '+NAMES[o.by][1]:'Nadie la ha tomado aún'} · ${prize(o)}</small></span><span style="display:flex;gap:8px;align-items:center"><span class="st ${stTxt[o.st][1]}">${stTxt[o.st][0]}</span>${o.url?`<button class="btn k" style="padding:7px 12px;font-size:13px" onclick="review(${o.id})">▶ Ver</button>`:''}</span></div>`).join(''):'<div class="empty">Aún no has publicado ofertas</div>'}</div>`;
 $('#main').innerHTML=h;
 const sync=()=>{const e=$('#f-aud').value=='est';$('#w-pay').querySelector('label').textContent=e?'Premio':'Pago';const p=$('#f-pay');p.type=e?'text':'number';p.value=e?'1 clase gratis':'12000';p.disabled=e;
  $('#f-topic').value=e?'Mi experiencia en mrarrieta.com':'Error común: “I have 25 years”';$('#f-pts').value=e?'Di tu nombre y de dónde eres\n¿Por qué elegiste mrarrieta.com?\n¿Qué has mejorado?\n¿Se lo recomendarías a alguien?':'“I have 25 years” está mal\nSe dice “I am 25 years old”\nDa 2 ejemplos más\nInvita a practicar en mrarrieta.com'};
 $('#f-aud').onchange=sync;
 $('#b-pub').onclick=()=>{const o={id:++oid,aud:$('#f-aud').value,topic:$('#f-topic').value.trim(),pts:$('#f-pts').value.split('\n').map(s=>s.trim()).filter(Boolean),pay:+$('#f-pay').value||0,st:'open',by:null};
  if(!o.topic)return;S.offers.push(o);render();
  openM(`<div class="topic">✓ Publicada</div><p class="sub" style="margin:6px 0 16px">Ahora entra arriba como <b>${o.aud=='est'?'Estudiante adulto':'Profe'}</b> para ver el aviso.</p><button class="btn" onclick="closeM()">Entendido</button>`)}}

/* ---------- popup ---------- */
function popCheck(){const r=S.role;if(r=='admin')return;const a=aud(r);
 const o=S.offers.find(o=>o.aud==a&&o.st=='open'&&!S.seen[r+o.id]);
 if(o){S.seen[r+o.id]=1;return openM(`<div class="topic">🎬 ${a=='est'?'Graba tu testimonio y gana <span style="color:var(--ok)">1 clase gratis</span>':'Aprovecha: graba un video y gana <span style="color:var(--ok)">'+prize(o)+'</span>'}</div>
 <p style="color:var(--mut);margin:8px 0 4px">Tema: <b style="color:var(--k)">${esc(o.topic)}</b></p>
 <ul class="pts"><li>Video vertical de máximo <b>1 minuto</b>: lo grabas aquí o lo subes desde tu celular</li><li>Te damos el guion en pantalla</li><li>Tienes <b>48 horas</b> para enviarlo</li><li>${a=='est'?'Cuando administración lo apruebe, la clase se suma a tu saldo':'Se paga si se aprueba · se suma a tu pago del mes'}</li></ul>
 <div style="font-size:13px;font-weight:700;color:var(--y);margin-bottom:14px">Solo hay 1 cupo: el primero que acepte se lo gana.</div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ok" onclick="accept(${o.id})">Acepto, lo grabo</button><button class="btn g" onclick="closeM()">Ahora no</button></div>`)}
 const t=S.offers.find(o=>o.aud==a&&o.by&&o.by!=r&&o.st!='ok'&&!S.seen[r+'t'+o.id]);
 if(t){S.seen[r+'t'+t.id]=1;openM(`<div style="text-align:center"><div style="font-size:30px">🎬</div><div class="topic">Este video ya fue tomado</div><p class="sub">Otro ${a=='est'?'estudiante':'profe'} aceptó primero. Te avisaremos en la próxima oferta.</p><button class="btn g" onclick="closeM()">Cerrar</button></div>`)}}
function accept(id){const o=S.offers.find(x=>x.id==id);
 if(o.by){return openM(`<div class="topic">Este video ya fue tomado</div><button class="btn g" onclick="closeM()">Cerrar</button>`)}
 o.by=S.role;o.st='taken';render();
 openM(`<div style="text-align:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--ok2);color:var(--ok);display:grid;place-items:center;margin:0 auto 10px;font-size:30px">✓</div><div class="topic">¡Es tuyo!</div><p class="sub">Tienes 48 horas para enviarlo.</p><button class="btn" onclick="tips(${id})">● Grabar ahora</button> <button class="btn g" onclick="closeM()">Más tarde</button></div>`)}

/* ---------- studio ---------- */
let cam=null,rec=null,chunks=[],tmr=null,raf=null,cur=null,SR=null,CAP=[],T0=0,REC_ON=false;
function stopCam(){REC_ON=false;try{rec&&rec.state!='inactive'&&rec.stop()}catch(e){}try{SR&&SR.stop()}catch(e){}clearInterval(tmr);cancelAnimationFrame(raf);if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}}
/* 1 · recomendaciones antes de grabar */
const IS_MOB=()=>window.__PCOK||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
function tips(id){closeM();cur=S.offers.find(x=>x.id==id);
 if(!IS_MOB()){$('#main').innerHTML=`<div class="card" style="max-width:560px;margin:30px auto;text-align:center;padding:30px 24px"><div style="font-size:54px">📱</div><div class="topic" style="font-size:22px;margin-top:6px">Este video se graba con tu celular</div>
  <p class="sub" style="font-size:15px;margin:10px 0 18px">La cámara del celular tiene mucha mejor calidad que la del computador. Así tu video sale nítido y profesional.</p>
  <div style="text-align:left;background:#F8FAFF;border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:15px;line-height:1.7"><b>1.</b> Abre <b>mrarrieta.com</b> en tu celular<br><b>2.</b> Entra a tu portal con tu código<br><b>3.</b> Toca <b>“Grabar o subir mi video”</b></div>
  <p style="font-size:13px;color:var(--mut);margin:14px 0 0">Tu video te espera allá durante 48 horas.</p></div>`;return}
 $('#main').innerHTML=`<h2>Antes de grabar</h2><p class="sub">${esc(cur.topic)} · máximo 1 minuto · ${prize(cur)}</p>
 <div class="card" style="max-width:620px;margin:0 auto"><div class="topic" style="font-size:18px">4 recomendaciones para que tu video quede profesional</div>
 <div class="tip"><span>👔</span><div><b>Vístete de forma adecuada</b><small>Ropa decente y sobria, como si fueras a dar una clase.</small></div></div>
 <div class="tip"><span>🤫</span><div><b>Busca un lugar silencioso</b><small>Sin ruido, sin música ni televisión de fondo.</small></div></div>
 <div class="tip"><span>💡</span><div><b>Buena iluminación</b><small>Ponte de frente a una ventana o a una luz. Nunca con la luz detrás de ti.</small></div></div>
 <div class="tip"><span>🖼️</span><div><b>Un fondo limpio</b><small>Una pared clara y ordenada. Sostén el celular en vertical, a la altura de tus ojos y a un brazo de distancia.</small></div></div>
 <div style="margin-top:16px"><button class="btn" onclick="studio(${id})">Entendido, activar cámara</button></div></div>`}
/* 2 · grabación (se graba la cámara en su máxima calidad; la vista previa va como espejo) */
function studio(id){closeM();cur=S.offers.find(x=>x.id==id);
 $('#main').innerHTML=`<h2>Graba tu video</h2><p class="sub">${esc(cur.topic)} · máximo 1 minuto · ${prize(cur)}</p>
 <div class="studio"><div class="phone"><canvas id="cv" width="720" height="1280"></canvas><div class="recb" id="rb">0:00</div><div class="prog" id="pg"></div><div class="lq" id="lq"></div><button class="recfab" id="b-go2" aria-label="Grabar"><i></i></button><div class="telem"><div id="tinm">${esc(cur.pts.join('\n'))}</div></div></div>
 <div class="side"><div class="card"><b>Guion</b><div class="tele"><div class="in" id="tin">${esc(cur.pts.join('\n\n'))}</div></div>
 <div id="ctl" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="b-go" disabled>● Grabar</button><label class="btn g" style="margin:0;text-transform:none;letter-spacing:0;font-size:15px;color:var(--k)">⬆ Subir video<input type="file" accept="video/*" id="fu" hidden></label></div>
 <p id="msg" style="font-size:13px;color:var(--mut);margin:10px 0 0">Activando tu cámara…</p></div></div></div>`;
 $('#fu').onchange=e=>{const f=e.target.files[0];if(!f)return;const v=document.createElement('video');v.preload='metadata';v.src=URL.createObjectURL(f);
  v.onloadedmetadata=()=>{if(v.duration>61){$('#msg').innerHTML='<b style="color:var(--y)">Ese video dura más de 1 minuto. Recórtalo o grábalo aquí.</b>';return}stopCam();CAP=window.__CAPTEST||[];edit(f)}};
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920},frameRate:{ideal:30}},audio:{noiseSuppression:true,echoCancellation:true,autoGainControl:true}}).then(s=>{cam=s;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=s;v.play();
  const cv=$('#cv'),cx=cv.getContext('2d'),sm=document.createElement('canvas');sm.width=32;sm.height=18;const sx2=sm.getContext('2d',{willReadFrequently:true});let fr=0;
