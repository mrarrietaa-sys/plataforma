  vb.innerHTML=`<iframe src="${esc(st.vurl)}" allow="camera; microphone; fullscreen; display-capture; autoplay; speaker-selection" title="Video de la clase"></iframe>`;return;}
 if(rol!=='profe'){vb.innerHTML='';return;}
 vb.innerHTML=`<div class="vset"><div>${I('phone')} Código de sala para el estudiante: <b>${room}</b></div><input id="v-url" value="https://mrarrieta.daily.co/prueba"><button id="v-go">Activar video de la clase</button><small style="opacity:.8">En la versión real esto es automático: no hay códigos ni enlaces.</small></div>`;
 $('#v-go').onclick=()=>{const v=$('#v-url').value.trim().replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9-]+\.daily\.co\/[A-Za-z0-9_-]+$/.test(v))return alert('El enlace debe verse así: https://mrarrieta.daily.co/prueba');send({vurl:v});};}
// ---------- modales del profe ----------
function modal(html){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div><button class="mx" aria-label="Cerrar">✕</button>${html}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('.mx'))m.remove();});return m;}
function topicModal(){const m=modal(`<h3>Cambiar tema</h3><p class="stt" style="margin:0">La clase cambia en las dos pantallas. El reloj sigue corriendo.</p><div class="tlist">${TOPICS.map((t,n)=>{n++;const ok=AVAIL.includes(n);return `<button data-t="${n}" class="${n===st.topic?'cur':''}"${ok?'':' disabled'}><b>${n}</b><span>${esc(t[0])}<br><small class="stt">${esc(t[1])}</small></span>${n===CHOSEN?'<em class="c">Elegido por '+SNAME+'</em>':''}${n===SUGGEST.n?'<em class="s">Sugerido</em>':''}${ok?'':'<em>Próximamente</em>'}</button>`;}).join('')}</div>`);
 m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const n=+b.dataset.t;m.remove();if(n===st.topic)return;ensureTopic(n).then(()=>send({topic:n,i:0,res:[],ok:0,rep:0,pts:0,fb:'',hl:-1,fin:null,rp:null}));});}
function contentModal(){const l=L(),c=l.content;modal(`<h3>Contenido del tema</h3><span class="ro">Solo lectura · para consultar durante la clase</span><div class="cnt">
 <h4>${I('bulb')} Explicación</h4>${c.explain}
 <h4>${I('book')} Vocabulario</h4><table>${c.vocab.map(v=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td></tr>`).join('')}</table>
 <h4>${I('book')} Lectura · ${esc(c.reading.title)}</h4><p>${esc(c.reading.text)}</p>
 <h4>${I('hand')} Preguntas clave</h4><table>${c.keyq.map(v=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td></tr>`).join('')}</table>
 <h4>${I('repeat')} Errores comunes</h4><table>${c.errors.map(v=>`<tr><td style="color:#b91c1c;font-weight:600">${esc(v[0])}</td><td>${esc(v[1])}</td></tr>`).join('')}</table></div>`);}
// ---------- pantallas ----------
let lastKey='';
function render(){videoUI();pzUI();if(st.topic&&!L()){ensureTopic(st.topic);$('#m-top').innerHTML='';$('#m-body').innerHTML='<div class="wait">Cargando la clase <span class="dots"><i></i><i></i><i></i></span></div>';return;}
 $('#hsub').textContent=`Módulo 1 (A1) · Tema ${L().n}: ${L().title}`;if(rol==='profe')renderT();else renderS();}
function bar(){const S=L().steps;return `<div class="steps">${S.map((x,n)=>`<i style="flex:${x.min}" class="${st.fin?(graded(x)?(st.res[n]===true?'d':st.res[n]===false?'x':'p'):'p'):graded(x)&&st.res[n]===true?'d':graded(x)&&st.res[n]===false?'x':n===st.i?'c':n<st.i?'p':''}" title="${esc(x.sec)}"></i>`).join('')}</div>`;}
function animKey(k,html){const a=k!==lastKey;lastKey=k;return a?`<div class="enter">${html}</div>`:html;}
let stepT0=Date.now(),stepI=-1;
function clockHTML(){if(!st.started)return '';const el=(Date.now()-st.started)/1000,s=L().steps[st.i],a=startOf(st.i),b=a+s.min*60;let pill;
 if(st.fin)pill='<span class="pill ok">Clase terminada</span>';else if(el>CLASS_MIN*60)pill='<span class="pill late">Tiempo cumplido · cierra la clase</span>';else if(el>b+60)pill=`<span class="pill late">Vas ${Math.round((el-b)/60)} min atrasado · avanza un poco</span>`;else if(el<a-90)pill=`<span class="pill early">Vas ${Math.round((a-el)/60)} min adelantado · puedes profundizar</span>`;else pill='<span class="pill ok">Vas a tiempo</span>';
 return `${I('clock')}<b>${mmss(el)} <small>/ ${CLASS_MIN}:00</small></b>${pill}`;}
function stepClock(){const s=L().steps[st.i],e=(Date.now()-stepT0)/1000;return `<span class="stt${e>s.min*60?' over':''}">${I('clock')} En este paso ${mmss(e)} de ${mmss(s.min*60)}</span>`;}
setInterval(()=>{if(rol!=='profe'||!L()||!st.started)return;const c=$('#clk');if(c)c.innerHTML=clockHTML();const s=$('#sclk');if(s)s.innerHTML=stepClock();},1000);
function renderT(){const l=L(),top=$('#m-top'),body=$('#m-body');
 if(st.i!==stepI){stepI=st.i;stepT0=Date.now();}
 const live=st.ready?`<span class="chip">${SNAME} conectado</span>`:`<span class="chip">Código: ${room}</span>`;
 top.innerHTML=`<div class="top"><h3>Clase con ${SNAME}</h3><span class="chip r live">EN VIVO</span>${live}<span class="chip">${st.ok} ✔ · ${st.pts} pts</span></div>
  <div class="tools"><button class="tb${st.pzOn?' on':''}" id="t-pz">${I('pen')} Pizarra</button><button class="tb" id="t-cnt">${I('book')} Contenido del tema</button><button class="tb" id="t-top">${I('swap')} Cambiar tema</button></div>
  ${st.started?`<div class="clock" id="clk">${clockHTML()}</div>${bar()}`:''}`;
 $('#t-pz').onclick=()=>send({pzOn:st.pzOn?0:1});$('#t-cnt').onclick=contentModal;$('#t-top').onclick=topicModal;
 if(!st.started){body.innerHTML=animKey('pre'+st.topic,`<div class="pre"><div class="hero"><img src="${U(l.cover,1100,620)}" alt=""><div><small>Tema ${l.n} · Módulo 1 (A1)</small><h2>${esc(l.title)}</h2><p>${esc(l.goal)}</p></div></div>
   <div class="sug"><span>${I('check')} Elegido por ${SNAME}: <b>${esc(TOPICS[CHOSEN-1][0])}</b></span><span>${I('bulb')} Sugerido según sus errores: <b>${esc(TOPICS[SUGGEST.n-1][0])}</b> (${esc(SUGGEST.why)})</span></div>
   <div class="tip n"><b>Clase de ${CLASS_MIN} minutos · ${l.steps.length} pasos.</b><small>Tú guías y ${SNAME} responde hablando. En cada paso verás qué decir, la respuesta esperada y cuánto tiempo darle.</small></div>
   <div class="st ${st.ready?'':'w'}">${I('phone')} ${st.ready?SNAME+' ya entró y ve la pantalla de bienvenida':'Esperando a que '+SNAME+' entre con el código '+room+'…'}</div>
   <div class="nav" style="grid-template-columns:1fr"><button class="btn go" id="t-start">${I('play')} Empezar clase (${CLASS_MIN} min)</button></div></div>`);
  $('#t-start').onclick=()=>send({started:Date.now(),i:0,res:[],ok:0,rep:0,pts:0,fb:'',fin:null,hl:-1});return;}
 if(st.fin){const s=summary(),used=Math.round((st.fin.end-st.started)/60000);body.innerHTML=animKey('fin',`<div class="sumH"><div class="big">${I(s.p>=70?'trophy':'heart')}</div><h2>Resumen de la clase</h2><p>${esc(l.title)} · ${used} min</p></div>
   <div class="sum"><div><b>${s.ok}/${s.N}</b><span>bien</span></div><div><b>${st.rep}</b><span>veces repitió</span></div><div><b>${st.pts}</b><span>puntos</span></div></div>
   ${s.miss.length?`<div class="box y"><h4>Para reforzar en la próxima clase</h4>${s.miss.map(x=>'• '+esc(x.t)+': <b>'+esc(x.ans)+'</b>').join('<br>')}</div>`:'<div class="box g"><h4>¡Excelente! Lo hizo todo bien.</h4></div>'}
   <div class="box b"><h4>Tarea enviada a ${SNAME}</h4>${esc(l.hw.es)}</div>
   <p class="stt">Este resumen y la pizarra se guardan en el tablero de la clase.</p>
   <div class="nav"><button class="btn prev" id="t-back">${I('back')} Volver</button><button class="btn next" id="t-new">Empezar de nuevo</button></div>`);
  $('#t-back').onclick=()=>send({fin:null,i:l.steps.length-1});$('#t-new').onclick=()=>send({i:0,fin:null,res:[],ok:0,rep:0,pts:0,fb:'',started:0,hl:-1});return;}
 const S=l.steps,s=S[st.i],seen=st.seen===st.topic+':'+st.i,mark=st.res[st.i],g=graded(s),last=st.i+1>=S.length;
 const norm=x=>String(x||'').toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
 const au=s.type==='write'?(st.said?`${SNAME} escribió: <b style="color:${norm(st.said)===norm(s.ans)?'#15803d':'#b91c1c'}">${esc(st.said)}</b>`:`Esperando lo que escriba ${SNAME}…`):st.aud==='play'?`${I('speaker')} ${SNAME} está escuchando el audio…`:st.aud==='done'?`✔ ${SNAME} ya escuchó el audio`:st.aud==='pause'?`⏸ ${SNAME} pausó el audio`:'';
 body.innerHTML=animKey(st.topic+':'+st.i,`<div class="stage"><span>Paso ${st.i+1} de ${S.length} · ${esc(s.sec)} <span id="sclk">${stepClock()}</span></span><select id="t-jump">${S.map((x,n)=>`<option value="${n}"${n===st.i?' selected':''}>${n+1}. ${esc(x.sec)} · ${esc(x.t)} (${x.min} min)</option>`).join('')}</select></div>
  ${s.say?`<div class="say"><span class="ic">${I('mic')}</span><div><small>Di en voz alta</small><q>${esc(s.say)}</q></div></div>`:''}
  ${st.pzOn?'':card(s,true)}
  <div class="st ${seen?'':'w'}">${I('phone')} ${seen?SNAME+' ya lo tiene en su pantalla':'Enviando a '+SNAME+'…'}</div>${au?`<div class="st">${au}</div>`:''}
  ${s.items?`<div class="stt" style="margin-top:6px">${I('hand')} Toca una foto: se resalta y suena en el celular de ${SNAME}.</div>`:''}
  ${s.au&&s.type!=='write'?`<button class="rp" id="t-rp">${I('speaker')} Reproducir el audio en el celular de ${SNAME}</button>`:''}
  ${g?`<div class="tip"><b>✅ Respuesta:</b> ${esc(s.ans)}<small>${esc(s.ok)}</small></div>`:`<div class="tip n"><b>${I('bulb')} Consejo</b><small>${esc(s.ok)}</small></div>`}
  ${g?`<div class="grade"><button class="btn ok${mark===true?' sel':''}" id="t-ok">${I('check')} Bien</button><button class="btn again${mark===false?' sel':''}" id="t-rep">${I('repeat')} Otra vez</button></div>
  <div class="marked ${mark===true?'g':mark===false?'r':''}">${mark===true?'✔ Enviado a '+SNAME+': «Well done!»':mark===false?'↻ Enviado: «Try again!» · cuando lo diga bien, toca Bien':''}</div>`:''}
  <div class="nav"><button class="btn prev" id="t-prev"${st.i?'':' disabled'}>${I('back')} Atrás</button><button class="btn next" id="t-next">${last?I('flag')+' Terminar clase':(s.type==='intro'?'Sí, empezamos ':'Siguiente ')+I('next')}</button></div>`);
 const setRes=v=>{const r=st.res.slice();r[st.i]=v;return r;},okN=r=>r.filter((x,n)=>x===true&&S[n]&&graded(S[n])).length;
 const rpN=()=>((st.rp&&st.rp.n)||0)+1;
 if(g){$('#t-ok').onclick=()=>{const r=setRes(true);send({fb:'ok',fbN:st.fbN+1,res:r,ok:okN(r),pts:okN(r)*10});flashMsg('Enviado: Well done!','ok');};
  $('#t-rep').onclick=()=>{const r=setRes(false);send({fb:'rep',fbN:st.fbN+1,rep:st.rep+1,res:r,ok:okN(r),pts:okN(r)*10});flashMsg('Enviado: Try again!','rep');};}
 const rp=$('#t-rp');if(rp)rp.onclick=()=>{send({rp:{k:s.au,n:rpN(),t:Date.now()}});flashMsg('Sonando en su celular','ok');};
 body.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;send({hl:n,rp:{k:[s.items[n].au],n:rpN(),t:Date.now(),tile:n}});});
 $('#t-prev').onclick=()=>send({i:Math.max(0,st.i-1),fb:'',hl:-1});
 $('#t-jump').onchange=e=>send({i:+e.target.value,fb:'',hl:-1});
 $('#t-next').onclick=()=>{if(last){const sm=summary();const fin={ok:sm.ok,n:sm.N,p:sm.p,end:Date.now()};send({fin,cheer:st.cheer+1,fb:'',pzOn:0});celebrate(fin);}else send({i:st.i+1,fb:'',hl:-1});};}
function renderS(){const l=L(),top=$('#m-top'),body=$('#m-body');
 if(!room){top.innerHTML='';body.innerHTML=`<div class="join"><b>Entrar a la clase</b><p style="color:var(--mu)">Escribe el código que te da tu profe.</p><input id="j-in" inputmode="numeric" maxlength="6" placeholder="0000"><button id="j-go">Entrar</button></div>`;
  $('#j-go').onclick=()=>{const v=$('#j-in').value.replace(/\D/g,'');if(v.length<4)return;unlockAudio();room=v;st.ready=Date.now();render();poll();push();};return;}
 const sc=`<div class="score"><span>${I('check')} ${st.ok}</span><span>${I('repeat')} ${st.rep}</span><span>${I('star')} ${st.pts} pts</span></div>`;
 top.innerHTML=`<div class="top"><h3>Clase con ${TNAME}</h3><span class="chip r live">EN VIVO</span></div>${st.started?bar():''}`;
 if(!st.started){body.innerHTML=animKey('wel'+st.topic,`<div class="hero" style="margin-top:10px;min-height:300px"><img src="${U(l.cover,1100,700)}" alt=""><div><small>Welcome, ${SNAME}!</small><h2>${esc(l.title)}</h2><p>${esc(l.es)} · Tema ${l.n} · Módulo 1 (A1)</p></div></div>
   <div class="box b" style="text-align:center"><h4>Today you will learn to…</h4><div class="chips" style="justify-content:center">${l.will.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
   <div class="wait">${TNAME} empieza la clase en un momento <span class="dots"><i></i><i></i><i></i></span></div>`);return;}
 if(st.fin){const s=summary();body.innerHTML=animKey('fin',`<div class="sumH" style="margin-top:10px"><div class="big">${I(st.fin.p>=70?'trophy':'heart')}</div><h2>${st.fin.p>=70?'Congratulations, '+SNAME+'!':'Good effort, '+SNAME+'!'}</h2><p>${st.fin.ok} de ${st.fin.n} bien en la clase de hoy</p></div>
   <div class="sum"><div><b>${st.fin.ok}/${st.fin.n}</b><span>bien</span></div><div><b>${st.pts}</b><span>puntos</span></div><div><b>${Math.max(1,Math.round((st.fin.end-st.started)/60000))}</b><span>minutos</span></div></div>
   <div class="box g"><h4>Today you learned</h4><div class="chips">${l.learned.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
   ${s.miss.length?`<div class="box y"><h4>Para practicar</h4>${s.miss.map(x=>'• '+esc(x.ans)).join('<br>')}</div>`:''}
   <div class="box b"><h4>Tu tarea</h4>${esc(l.hw.es)}<br><small class="stt">Ejemplo: ${esc(l.hw.model)}</small></div>`);return;}
 const s=l.steps[st.i],key=st.topic+':'+st.i;if(st.seen!==key){st.seen=key;st.aud='';push();}
 const fb=st.fb==='ok'?`<div class="status ok">${I('check')} Well done!</div>`:st.fb==='rep'?`<div class="status rep">${I('repeat')} Try again!</div>`:'';
 const wi=$('#w-in'),wv=wi?wi.value:null,wf=wi&&document.activeElement===wi;
 const hint=s.type==='write'?`<div class="wr"><input id="w-in" placeholder="Escribe aquí" autocomplete="off" autocapitalize="sentences"><button id="w-ok" aria-label="Enviar">${I('send')}</button></div>`:s.type==='qa'||s.type==='intro'?'':s.items?`<div class="hint">${I('mic')} Toca una foto, escucha y repite</div>`:s.type==='read'?`<div class="hint">${I('mic')} Lee el texto en voz alta</div>`:`<div class="hint">${I('mic')} Responde hablando a tu profe</div>`;
 body.innerHTML=animKey(key,`<div style="margin-top:10px">${st.pzOn?'':card(s,false)}</div>${hint}${fb}${graded(s)?sc:''}`);
 if(s.type==='write'){const w=$('#w-in');w.value=wv!=null?wv:(st.said||'');if(wf){w.focus();}const go=()=>{const v=w.value.trim();if(v){send({said:v});flashMsg('Enviado a tu profe','ok');}};$('#w-ok').onclick=go;w.onkeydown=e=>{if(e.key==='Enter')go();};}
 const pl=$('#a-play');if(pl)pl.onclick=()=>{pl.classList.remove('pulse');if(pl.classList.contains('on')){stopAudio();return;}if((s.type==='listen'||s.type==='read'||s.type==='role')&&player.src&&player.paused&&player.currentTime>0&&st.aud==='pause'){curBtn=pl;markBtn(true);st.aud='play';push();player.play();return;}playSeq(s.au,pl);};
 const ps=$('#a-stop');if(ps)ps.onclick=()=>stopAudio();
 body.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;body.querySelectorAll('.tile').forEach(t=>t.classList.toggle('hl',t===b));playSeq([s.items[n].au],b);});}
ensureTopic(st.topic);render();if(rol==='profe'){poll();push();}
if(rol==='estudiante')$('#help').style.display='none';
})();
</script></body></html>
