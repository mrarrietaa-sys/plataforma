  <div class="nav"><button class="btn prev" id="t-prev"${st.i?'':' disabled'}>${I('back')} Atrás</button><button class="btn next" id="t-next">${last?I('flag')+' Terminar clase':(s.type==='intro'?'Sí, empezamos ':'Siguiente ')+I('next')}</button></div>`);
 const setRes=v=>{const r=st.res.slice();r[st.i]=v;return r;},okN=r=>r.filter((x,n)=>x===true&&S[n]&&graded(S[n])).length;
 if(g){$('#t-ok').onclick=()=>{const r=setRes(true);send({fb:'ok',fbN:st.fbN+1,res:r,ok:okN(r),pts:okN(r)*10});flashMsg('Enviado: Well done!','ok');};
  $('#t-rep').onclick=()=>{const r=setRes(false);send({fb:'rep',fbN:st.fbN+1,rep:st.rep+1,res:r,ok:okN(r),pts:okN(r)*10});flashMsg('Enviado: Try again!','rep');};}
 const rp=$('#t-rp');if(rp)rp.onclick=()=>{if(player.dataset.k)shareStop();else if(s.items)shareAudio(AU,null,s.items.map((x,n)=>n));else shareAudio(AU);};
 body.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;st.hl=n;shareAudio([s.items[n].au],n);});
 body.querySelectorAll('.txtR .s').forEach(b=>b.onclick=()=>{const n=+b.dataset.s;send({sh:st.sh===n?-1:n});});
 const nxt=p=>{stopAudio(true);send(Object.assign({fb:'',hl:-1,sh:-1},p));};
 $('#t-prev').onclick=()=>nxt({i:Math.max(0,st.i-1)});
 $('#t-jump').onchange=e=>nxt({i:+e.target.value});
 $('#t-next').onclick=()=>{if(last){const sm=summary();const fin={ok:sm.ok,n:sm.N,p:sm.p,end:Date.now()};nxt({fin,cheer:st.cheer+1,pzOn:0});celebrate(fin);if(PLATFORM)saveBoard();}else nxt({i:st.i+1});};}
function claimBtn(){return PLATFORM&&!REMOTE&&!st.fin?`<button class="claimb" id="s-claim">${I('flag')} Mi profe no se conectó</button>`:'';}
function bindClaim(){const b=$('#s-claim');if(!b)return;b.onclick=()=>{const left=Math.ceil((INFO.startMs+15*60000-Date.now())/60000);
 if(left>0)return modal(`<h3>⏳ Aún no puedes reportar</h3><p>El tiempo de espera para reportar es de <b>15 minutos</b> después de la hora de inicio de la clase (${h12ms(INFO.startMs)}). <b>Aún faltan ${left} minuto${left===1?'':'s'}.</b></p>`);
 const m=modal(`<h3>🚩 ¿Tu profe no se conectó?</h3><p>Cuéntanos qué pasó (opcional). Administración lo revisa y, si se confirma, la clase vuelve a tu saldo.</p><textarea id="cl-n" rows="3" style="width:100%;border:2px solid var(--bd);border-radius:12px;padding:10px;font:600 15px Inter" placeholder="Ej.: esperé 15 minutos y mi profe no entró"></textarea><button class="btn go" id="cl-go" style="width:100%;margin-top:10px">Enviar reporte</button>`);
 m.querySelector('#cl-go').onclick=async e=>{e.target.disabled=true;let p=null;try{p=JSON.parse(localStorage.getItem('mra_profile_v1')||'null');}catch(x){}const r=await call('claim',{code:p&&p.code,classId:CID,note:m.querySelector('#cl-n').value}).catch(()=>null);m.remove();
  modal(r&&r.ok?'<h3>✅ Reporte enviado</h3><p>Administración lo revisa en máximo 24 horas. Si se confirma, la clase vuelve a tu saldo.</p>':r&&r.err==='exists'?'<h3>Ya reportaste esta clase</h3><p>Administración ya la está revisando.</p>':'<h3>No se pudo enviar</h3><p>Inténtalo de nuevo o hazlo desde tu perfil.</p>');};};}
function renderS(){const l=L(),top=$('#m-top'),body=$('#m-body');
 if(!room){top.innerHTML='';body.innerHTML=`<div class="join"><b>Entrar a la clase</b><p style="color:var(--mu)">Escribe el código que te da tu profe.</p><input id="j-in" inputmode="numeric" maxlength="6" placeholder="0000"><button id="j-go">Entrar</button></div>`;
  $('#j-go').onclick=()=>{const v=$('#j-in').value.replace(/\D/g,'');if(v.length<4)return;unlockAudio();room=v;st.ready=Date.now();render();poll();push();};return;}
 const sc=`<div class="score"><span>${I('check')} ${st.ok}</span><span>${I('repeat')} ${st.rep}</span><span>${I('star')} ${st.pts} pts</span></div>`;
 top.innerHTML=`<div class="top"><h3>Clase con ${TNAME}</h3><span class="chip r live">EN VIVO</span></div>${st.started?bar():''}`;
 if(!st.started){body.innerHTML=animKey('wel'+st.mod+st.topic,`<div class="hero" style="margin-top:10px;min-height:300px"><img src="${U(l.cover,1100,700)}" alt=""><div><small>Today's class</small><h2>${esc(l.title)}</h2><p>${esc(l.es)} · Tema ${l.n} · ${modLabel(l)}</p></div></div>
   <div class="box b" style="text-align:center"><h4>Today's goal</h4><div style="font:700 18px Poppins;color:var(--n)">${esc(l.goalEn)}</div><small class="stt">${esc(l.goal)}</small></div>
   <div class="wait">${I('clock')} Tu clase dura ${CLASS_MIN} minutos · ${TNAME} empieza en un momento <span class="dots"><i></i><i></i><i></i></span></div>${claimBtn()}`);bindClaim();return;}
 if(st.fin){const s=summary();body.innerHTML=animKey('fin',`<div class="sumH" style="margin-top:10px"><div class="big">${I(st.fin.p>=70?'trophy':'heart')}</div><h2>${st.fin.p>=70?'Congratulations, '+SNAME+'!':'Good effort, '+SNAME+'!'}</h2><p>${st.fin.ok} de ${st.fin.n} bien en la clase de hoy</p></div>
   <div class="sum"><div><b>${st.fin.ok}/${st.fin.n}</b><span>bien</span></div><div><b>${st.pts}</b><span>puntos</span></div><div><b>${Math.max(1,Math.round((st.fin.end-st.started)/60000))}</b><span>minutos</span></div></div>
   <div class="box g"><h4>Today you learned</h4><div class="chips">${l.learned.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
   ${s.miss.length?`<div class="box y"><h4>Para practicar</h4>${s.miss.map(x=>'• '+esc(x.ans)).join('<br>')}</div>`:''}`);return;}
 const s=l.steps[st.i],key=st.mod+'-'+st.topic+':'+st.i;if(st.seen!==key){st.seen=key;st.aud='';push();}
 const fb=st.fb==='ok'?`<div class="status ok">${I('check')} Well done!</div>`:st.fb==='rep'?`<div class="status rep">${I('repeat')} Try again!</div>`:'';
 const wi=$('#w-in'),wv=wi?wi.value:null,wf=wi&&document.activeElement===wi;
 const hint=s.type==='write'?`<div class="wr"><input id="w-in" placeholder="Escribe aquí" autocomplete="off" autocapitalize="sentences"><button id="w-ok" aria-label="Enviar">${I('send')}</button></div>`:s.type==='free'?`<div class="fw"><textarea id="w-in" placeholder="Write here… / Escribe aquí…" autocapitalize="sentences"></textarea><button id="w-ok">${I('send')} Enviar a mi profe</button></div>`:s.type==='qa'||s.type==='intro'||s.type==='yn'?'':s.items?`<div class="hint">${I('mic')} Escucha y repite</div>`:s.type==='read'?`<div class="hint">${I('mic')} Escucha, lee y después lee en voz alta</div>`:`<div class="hint">${I('mic')} Responde hablando a tu profe</div>`;
 body.innerHTML=animKey(key,`<div style="margin-top:10px">${st.pzOn?'':card(s,false)}</div>${hint}${fb}${graded(s)?sc:''}${claimBtn()}`);bindClaim();
 if(s.type==='write'||s.type==='free'){const w=$('#w-in');w.value=wv!=null?wv:(st.said||'');if(wf)w.focus();const go=()=>{const v=w.value.trim();if(v){send({said:v});flashMsg('Enviado a tu profe','ok');}};$('#w-ok').onclick=go;if(s.type==='write')w.onkeydown=e=>{if(e.key==='Enter')go();};}
 body.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{const y=st.yn.slice();y[+b.dataset.yn]=b.dataset.v;send({yn:y});});
 const pl=$('#a-play');if(pl)pl.onclick=()=>{pl.classList.remove('pulse');if(player.dataset.k)return flashMsg('Escuchando… tu profe puede detenerlo');if(s.items)shareAudio(s.items.map(x=>x.au),null,s.items.map((x,n)=>n));else shareAudio(s.au);};
 body.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(player.dataset.k)return;const n=+b.dataset.n;shareAudio([s.items[n].au],n);});}
if(DEMO&&(()=>{try{return !JSON.parse(sessionStorage.getItem('mra_tp_session')||'null');}catch(e){return true;}})()){$('#m-top').innerHTML='';$('#m-body').innerHTML=`<div class="pre" style="padding:24px 8px"><h2 style="font:800 22px Poppins;color:var(--n)">Solo para profes de mrarrieta.com</h2><p style="color:var(--mu)">Entra a tu portal docente y abre la práctica desde Herramientas → Clases en vivo.</p><a class="btn next" href="profesores.html" style="text-decoration:none;display:inline-flex;padding:12px 22px">Ir a mi portal docente</a></div>`;$('#vbox').innerHTML='';}
else if(PLATFORM)boot();else{ensureTopic(st.topic);render();if(rol==='profe'&&!DEMO){poll();push();}}
if(rol==='estudiante'||PLATFORM||DEMO)$('#help').style.display='none';
if(PLATFORM||DEMO){const hb=$('#hback');hb.href=rol==='profe'?'profesores.html':'index.html';hb.hidden=false;}
})();
</script></body></html>
