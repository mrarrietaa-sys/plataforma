 if(st.vurl){vb.innerHTML=`<iframe src="${esc(st.vurl)}" allow="camera; microphone; fullscreen; display-capture; autoplay; speaker-selection" title="Video de la clase"></iframe>`;return;}
 if(rol!=='profe'){vb.innerHTML='';return;}
 vb.innerHTML=`<div class="vset"><div>${I('phone')} Código de sala para el estudiante: <b>${room}</b></div><input id="v-url" value="https://mrarrieta.daily.co/prueba"><button id="v-go">Activar video de la clase</button><small style="opacity:.8">En la versión real esto es automático: no hay códigos ni enlaces.</small></div>`;
 $('#v-go').onclick=()=>{const v=$('#v-url').value.trim().replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9-]+\.daily\.co\/[A-Za-z0-9_-]+$/.test(v))return alert('El enlace debe verse así: https://mrarrieta.daily.co/prueba');send({vurl:v});};}
// ---------- pantallas ----------
function render(){videoUI();if(rol==='profe')renderT();else renderS();}
function bar(){return `<div class="steps">${STEPS.map((x,n)=>`<i class="${st.res[n]===true?'d':st.res[n]===false?'x':n===st.i&&!st.fin?'c':''}"></i>`).join('')}</div>`;}
function summary(){const ok=st.res.filter(x=>x===true).length,miss=STEPS.filter((x,n)=>st.res[n]===false);return {ok,miss,p:Math.round(ok/N*100)};}
function renderT(){const m=$('#main');
 if(st.fin){const s=summary();m.innerHTML=`<div class="top"><h3>Resumen de la clase</h3><span class="chip">Tema 3: The Nationalities</span></div>${bar()}<div class="sum"><div><b>${s.ok}/${N}</b><span>bien a la primera</span></div><div><b>${st.rep}</b><span>veces repitió</span></div><div><b>${st.pts}</b><span>puntos</span></div></div>${s.miss.length?`<div class="miss"><b>Para reforzar en la próxima clase:</b><br>${s.miss.map(x=>'• '+esc(x.t)+': '+esc(x.ans)).join('<br>')}</div>`:'<div class="ans"><b>¡Excelente! Lo hizo todo bien.</b></div>'}<p class="more">Este resumen se guarda solo en el tablero de la clase.</p><div class="nav"><button class="btn prev" id="t-back">${I('back')} Volver</button><button class="btn next" id="t-new">Empezar de nuevo</button></div>`;
  $('#t-back').onclick=()=>send({fin:null,i:N-1});$('#t-new').onclick=()=>send({i:0,fin:null,res:[],ok:0,rep:0,pts:0,fb:'',started:Date.now()});return;}
 const s=STEPS[st.i],seen=st.seen===String(st.i),mark=st.res[st.i];
 const au=s.write?(st.said?`Carlos escribió: <b style="color:${st.said.trim().toLowerCase()===s.ans.toLowerCase()?'#15803d':'#b91c1c'}">${esc(st.said)}</b>`:'Esperando lo que escriba Carlos…'):st.aud==='play'?'🔊 Carlos está escuchando el audio…':st.aud==='done'?'✔ Carlos ya escuchó el audio':st.aud==='pause'?'⏸ Carlos pausó el audio':'';
 m.innerHTML=`<div class="top"><h3>Clase con Carlos</h3><span class="chip r">● EN VIVO</span><span class="chip">Código: ${room}</span><span class="chip">${st.ok} ✔ · ${st.pts} pts</span></div>${bar()}
  <div class="stage"><span>Paso ${st.i+1} de ${N} · ${esc(s.sec)}</span><select id="t-jump">${STEPS.map((x,n)=>`<option value="${n}"${n===st.i?' selected':''}>${n+1}. ${esc(x.sec)} · ${esc(x.t)}</option>`).join('')}</select></div>
  ${card(s,true)}<div class="st ${seen?'':'w'}">${I('phone')} ${seen?'Carlos ya lo tiene en su pantalla':'Enviando a Carlos…'}</div>${au?`<div class="st">${au}</div>`:''}
  <div class="ans">✅ <b>Respuesta:</b> ${esc(s.ans)}<small>${esc(s.ok)}</small></div>
  <div class="grade"><button class="btn ok" id="t-ok">${I('check')} Bien</button><button class="btn again" id="t-rep">${I('repeat')} Otra vez</button></div>
  <div class="marked ${mark===true?'g':mark===false?'r':''}">${mark===true?'Marcado: bien ✔':mark===false?'Marcado: lo repitió':''}</div>
  <div class="nav"><button class="btn prev" id="t-prev"${st.i?'':' disabled'}>${I('back')} Atrás</button><button class="btn next" id="t-next">${st.i+1>=N?I('flag')+' Terminar clase':'Siguiente '+I('next')}</button></div>`;
 const setRes=v=>{const r=st.res.slice();if(r[st.i]===undefined||v===true&&r[st.i]!==true)r[st.i]=v;return r;};
 $('#t-ok').onclick=()=>send({fb:'ok',fbN:st.fbN+1,pts:st.pts+10,ok:st.ok+1,res:setRes(st.res[st.i]===false?false:true)});
 $('#t-rep').onclick=()=>send({fb:'rep',fbN:st.fbN+1,rep:st.rep+1,res:setRes(false)});
 $('#t-prev').onclick=()=>send({i:Math.max(0,st.i-1),fb:''});
 $('#t-jump').onchange=e=>send({i:+e.target.value,fb:''});
 $('#t-next').onclick=()=>{if(st.i+1>=N){const sm=summary();const fin={ok:sm.ok,n:N,p:sm.p};send({fin,cheer:st.cheer+1,fb:''});celebrate(fin);}else send({i:st.i+1,fb:''});};}
function renderS(){const m=$('#main');
 if(!room){m.innerHTML=`<div class="join"><b>Entrar a la clase</b><p style="color:#5b6577">Escribe el código que te da tu profe.</p><input id="j-in" inputmode="numeric" maxlength="6" placeholder="0000"><button id="j-go">Entrar</button></div>`;$('#j-go').onclick=()=>{const v=$('#j-in').value.replace(/\D/g,'');if(v.length<4)return;room=v;render();poll();};return;}
 const sc=`<div class="score"><span>${I('check')} ${st.ok}</span><span>${I('repeat')} ${st.rep}</span><span>${I('star')} ${st.pts} pts</span></div>`;
 if(st.fin){m.innerHTML=`<div class="done"><div class="big" style="color:${st.fin.p>=70?'#16a34a':'#E3242B'}">${I(st.fin.p>=70?'trophy':'heart')}</div><b>${st.fin.p>=70?'Congratulations!':'Good effort!'}</b><p style="color:#5b6577">${st.fin.ok} de ${st.fin.n} bien en la clase de hoy.</p></div>${sc}`;return;}
 const s=STEPS[st.i];if(st.seen!==String(st.i)){st.seen=String(st.i);st.aud='';push();}
 const fb=st.fb==='ok'?`<div class="status ok">${I('check')} Well done!</div>`:st.fb==='rep'?`<div class="status rep">${I('repeat')} Try again!</div>`:'';
 const pp=m.querySelector('.pop');
 m.innerHTML=`<div class="top"><h3>Clase con Mrs. Jennifer</h3><span class="chip r">● EN VIVO</span><button class="chip" id="s-code" style="border:0;cursor:pointer">Sala ${room} · cambiar</button></div>${bar()}${card(s,false)}
  ${s.write?`<div class="wr"><input id="w-in" placeholder="Escribe aquí" autocomplete="off" autocapitalize="words"><button id="w-ok">${I('send')}</button></div>`:`<div class="say">${I('mic')} Responde hablando a tu profe</div>`}${fb}${sc}`;
 if(pp)m.appendChild(pp);
 if(s.write){const w=$('#w-in');w.value=st.said||'';const go=()=>{const v=w.value.trim();if(v)send({said:v});};$('#w-ok').onclick=go;w.onkeydown=e=>{if(e.key==='Enter')go();};}
 const sc2=$('#s-code');if(sc2)sc2.onclick=()=>{sessionStorage.removeItem('mra_room_s');location.reload();};
 const pl=$('#a-play');if(pl)pl.onclick=()=>{if(pl.classList.contains('on')){stopAudio();pl.classList.remove('on');return;}if(s.lis&&player.src&&player.paused&&player.currentTime>0&&!queue.length&&st.aud==='pause'){pl.classList.add('on');st.aud='play';push();player.play();return;}playSeq(pl.dataset.au.split(','),pl);};
 const ps=$('#a-stop');if(ps)ps.onclick=()=>{stopAudio();if(pl)pl.classList.remove('on');};}
render();if(room){poll();if(mySide==='t')push();}
if(rol==='estudiante')$('#help').style.display='none';
})();
</script></body></html>
